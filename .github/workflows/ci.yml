name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install API local runtime deps
        working-directory: .
        run: npm --prefix api ci
      - name: Start API for E2E
        working-directory: .
        run: |
          npm --prefix api run dev > /tmp/api-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:7071/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          cat /tmp/api-dev.log || true
          exit 1
      - run: npm run test:e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ./onlyfling-com.sln -c Release

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep

  tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate PowerShell tooling syntax
        shell: pwsh
        run: |
          Get-ChildItem .\scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw ($errors | ForEach-Object Message | Out-String)
            }
          }
      - name: Dry-run local validation tooling
        shell: pwsh
        run: .\scripts\validate-local-system.ps1 -DryRun
      - name: Validate GA helper wiring
        shell: pwsh
        run: .\scripts\test-ga-wiring.ps1 -ConfigOnly -MeasurementId G-TESTME
