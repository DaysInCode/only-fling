name: deploy-static-web-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/deploy-static-web-app.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static web export
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_HILL_094710B03 != '' && secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_HILL_094710B03 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/out
          skip_app_build: true

      - name: Smoke test deployed Static Web App
        shell: pwsh
        env:
          SWA_URL: ${{ steps.swa.outputs.static_web_app_url }}
          FALLBACK_SWA_URL: ${{ vars.SWA_PRODUCTION_URL }}
        run: |
          $target = if ([string]::IsNullOrWhiteSpace($env:SWA_URL)) { $env:FALLBACK_SWA_URL } else { $env:SWA_URL }
          if ([string]::IsNullOrWhiteSpace($target)) {
            throw "Static Web App URL was not available from deploy output and SWA_PRODUCTION_URL variable is not set."
          }
          .\scripts\test-swa-smoke.ps1 -WebUrl $target -ExpectedText "OnlyFling"
