name: deploy-static-web-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - web/**
      - scripts/**
      - .github/workflows/deploy-static-web-app.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web_artifact_name: web-static-export
      release_tag: release-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static web export
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          SWA_PRODUCTION_URL: ${{ vars.SWA_PRODUCTION_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ] && [ -n "$SWA_PRODUCTION_URL" ]; then
            export NEXT_PUBLIC_API_BASE_URL="${SWA_PRODUCTION_URL%/}/api"
          fi
          npm ci
          npm run lint
          npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: web/out
          if-no-files-found: error
          retention-days: 14

  draft_release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Create deployment release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Deploy ${{ github.run_number }}
          draft: true
          prerelease: true
          generate_release_notes: true

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - draft_release
    if: always() && needs.build.result == 'success' && (needs.draft_release.result == 'success' || needs.draft_release.result == 'skipped')
    environment: production
    outputs:
      static_web_app_url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-static-export
          path: web/out

      - name: Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_HILL_094710B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/out
          skip_app_build: true

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Smoke test deployed web and API
        shell: pwsh
        env:
          SWA_URL: ${{ needs.deploy.outputs.static_web_app_url }}
          FALLBACK_SWA_URL: ${{ vars.SWA_PRODUCTION_URL }}
        run: |
          $target = if ([string]::IsNullOrWhiteSpace($env:SWA_URL)) { $env:FALLBACK_SWA_URL } else { $env:SWA_URL }
          if ([string]::IsNullOrWhiteSpace($target)) {
            throw "Static Web App URL was not available from deploy output and SWA_PRODUCTION_URL variable is not set."
          }
          "DEPLOY_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          .\scripts\test-deployment.ps1 -WebUrl $target -ApiBaseUrl "$target/api" -ExpectedText "OnlyFling" -ApiSampleCount 5

      - name: Capture payout screenshot
        working-directory: web
        run: |
          npm ci
          npx cypress run --spec cypress/e2e/payout-smoke.cy.ts --config baseUrl=$DEPLOY_TARGET --env apiBaseUrl=$DEPLOY_TARGET/api

      - name: Upload payout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payout-screenshots
          path: web/cypress/screenshots/**
          if-no-files-found: warn
