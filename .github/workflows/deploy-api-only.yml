name: deploy-api-only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/deploy-api-only.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Build and package API
        shell: bash
        run: |
          dotnet publish api/OnlyFling.Api.csproj -c Release -o api-publish
          cd api-publish
          zip -r ../api-release.zip .
      
      - name: Deploy to Function App
        shell: bash
        run: |
          az functionapp deployment source config-zip \
            --resource-group "rg-creator-platform-prod" \
            --name "onlyfling-api-prod" \
            --src api-release.zip
      
      - name: Test deployed API
        shell: bash
        run: |
          # Test health endpoint
          curl -f "https://onlyfling-api-prod.azurewebsites.net/api/health" || exit 1
